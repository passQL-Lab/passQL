spring:
  application:
    name: passql
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  profiles:
    active: prod
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    # DB가 이미 높은 버전까지 적용된 뒤 낮은 번호 마이그레이션이 늦게 추가되면
    # 기본 설정은 조용히 스킵함 (V0_0_95 로그인 장애 원인) — 반드시 유지
    out-of-order: true

server:
  port: 8080

suhapilog:
  enabled: true
  github:
    base-url: "https://github.com/passQL-Lab/passQL/issues/"

# SSE 스트림 엔드포인트는 ContentCachingResponseWrapper 버퍼링으로 스트림이 망가지므로 로깅 제외
# suh-logger의 excludePatterns는 String.contains() 기반이므로 suffix 문자열만 지정
suh-logger:
  exclude-patterns:
    - "generate-choices"

springdoc:
  swagger-ui:
    path: /docs/swagger
  api-docs:
    path: /docs/api-docs
  packages-to-scan: com.passql
  paths-to-match: /api/**

admin:
  username: ${ADMIN_USERNAME:admin}
  password-hash: ${ADMIN_PASSWORD_HASH:}
